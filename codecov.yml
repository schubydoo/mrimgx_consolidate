# Codecov configuration. Coverage is reported here for the pull request comment, the
# trend graph and the per-module breakdown. The real gate is the line floor in
# .github/workflows/ci.yml, where the coverage job runs
# `cargo llvm-cov --fail-under-lines 87`. One Linux cell uploads, so flags and report
# merging are not needed. Tokenless, because the repository is public.
#
# Codecov reads the lcov that `cargo llvm-cov --lcov` writes. Baseline 90.4 percent of
# lines on the public corpus (2026-09-18). Validate this file with:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # The coverage job uploads even when the floor step fails, so a drop shows up
  # exactly when a change breaks the floor. Do not gate on CI.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "85...94"
  status:
    project:
      default:
        target: 87%
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false
        if_not_found: success

# src/main.rs is the process entry: parse, dispatch, exit code. A run of the binary
# exercises it. The line floor in CI still measures it.
ignore:
  - "src/main.rs"

github_checks:
  annotations: false

comment:
  layout: "condensed_header, diff, components, files"
  behavior: default
  require_changes: true
  hide_project_coverage: false

# Per-module breakdown. The paths must be explicit files. Codecov ignores `**` globs
# in this section, and the component then renders empty even at 100 percent.
component_management:
  individual_components:
    - component_id: format
      name: format (blocks, index, json, reader)
      paths:
        - src/block.rs
        - src/index.rs
        - src/json.rs
        - src/reader.rs
    - component_id: plan
      name: plan (what a merge moves)
      paths:
        - src/plan.rs
    - component_id: write
      name: write (the output file)
      paths:
        - src/write.rs
    - component_id: commit
      name: commit (lock, space, rename)
      paths:
        - src/commit.rs
    - component_id: crypto
      name: crypto (keys and block IVs)
      paths:
        - src/crypto.rs
    - component_id: verify
      name: verify (read back and hash)
      paths:
        - src/verify.rs
    - component_id: sets
      name: sets (discovery and scan)
      paths:
        - src/set.rs
        - src/scan.rs
    - component_id: cli
      name: cli (commands and output)
      paths:
        - src/cli.rs
    # The crate root re-exports the modules, so it holds few coverable lines. It is
    # listed for a complete module map.
    - component_id: lib
      name: lib (crate root)
      paths:
        - src/lib.rs
