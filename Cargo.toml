[package]
name = "mrimgx-consolidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Consolidate Macrium Reflect X backup sets on Linux, FreeBSD and macOS"
license = "MIT"
repository = "https://github.com/schubydoo/mrimgx-consolidate"
readme = "README.md"
keywords = ["backup", "macrium", "reflect", "mrimgx", "consolidate"]
categories = ["command-line-utilities", "filesystem"]
# Ship only what `cargo install` needs. src is self-contained: no build.rs and no
# include_str!, so docs/, .github/ and the test corpus stay out of the published crate.
include = ["src/**/*.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# The $JSON metadata block is byte-exactly nlohmann's dump(4) with sorted keys. serde_json
# without preserve_order stores objects in a BTreeMap, which sorts keys the same way, so a
# parse and re-emit round-trips real files byte for byte. Turning preserve_order ON would
# break that. See scratch/format-notes.md.
serde = "1"
serde_json = "1"

# MetadataBlockHeader.hash and DataBlockIndexElement.md5_hash are both MD5. The format
# chose it, not us.
md-5 = "0.11"

# Every compressed block is an independent zstd frame whose header carries the content
# size, because the reference reader calls ZSTD_getFrameContentSize on it. Consolidation
# copies data blocks without decompressing them, so this is only needed for metadata
# blocks and for the optional end-to-end verify.
zstd = "0.14"

# Temporary file naming only. The output is written under a random name in the destination
# directory, so two runs cannot collide and the rename into place stays on one file system.
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[profile.release]
# One small static binary is the point: this replaces a 10 MB Windows GUI tool.
lto = true
strip = true
panic = "abort"
codegen-units = 1
