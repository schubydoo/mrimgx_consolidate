# Spell-check configuration for the `typos` lint in .github/workflows/ci.yml.
#
# The image id in a backup file name is 16 hexadecimal digits, for example
# 584221F3840B0DBE. The checker reads runs such as "DBE" inside one as a misspelled
# word, so any 16-digit hexadecimal run is ignored.

[default]
extend-ignore-re = ["\\b[0-9A-F]{16}\\b"]
